<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calorie Pass</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Calorie Pass</h1>

    <section id="login" hidden>
      <form id="login-form" class="card">
        <label for="code">Enter your shared code</label>
        <input id="code" type="password" autocomplete="current-password" required>
        <button type="submit">Enter</button>
        <p id="login-error" class="error"></p>
      </form>
    </section>

    <section id="pick" hidden>
      <div class="card">
        <h2>Who's using this device?</h2>
        <p class="muted">You'll only be asked once on this device.</p>
        <div id="pick-buttons" class="pick-buttons"></div>
      </div>
    </section>

    <section id="main" hidden>
      <form id="log-form" class="card">
        <p class="me-line">
          <span>Logging as <strong id="me"></strong></span>
          <button id="switch-player" class="link" type="button">Not you?</button>
        </p>

        <label for="calories">Today's calories</label>
        <input id="calories" type="number" inputmode="numeric" min="0" max="20000" required>

        <button type="submit">Log it</button>
        <p id="status" class="muted"></p>
      </form>

      <div id="passes"></div>

      <button id="logout" class="link" type="button">Forget this device</button>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
